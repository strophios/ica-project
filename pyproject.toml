[project]
name = "ica-project"
version = "0.1.0"
description = "Deep learning for immigrant collective action classification."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "tensorflow-metal; sys_platform == 'darwin'",
  "tensorflow[and-cuda]; sys_platform == 'linux'",
  "tensorflow-text",
  "keras",
  "keras_hub",
  "numpy",
  "polars",
  # "cvxopt>=1.3.2",  # only needed for ramaswamy2016 prior estimation (not in use)
  "scikit-learn>=1.7.2",
  "scipy>=1.16.3",  # used by DEDPUL (gaussian_kde in dedpul_em.py)
  "pandas>=2.3.3",
  "pydot>=4.0.1",
  "graphviz>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
# Run pytest from the project root; src/ uses implicit namespace packages,
# so we add "." to pythonpath to allow `import src.foo.bar` to resolve.
pythonpath = ["."]
testpaths = ["tests"]
